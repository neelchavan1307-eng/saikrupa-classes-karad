workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 20
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      groups:
        - codemagic
    scripts:
      - name: Get packages
        script: |
          flutter pub get
      - name: Generate Icon
        script: |
          flutter pub run flutter_launcher_icons
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
