name: Build Saikrupa APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Build APK
        run: |
          rm -rf android/
          flutter create . --platforms=android --org com.saikrupa.classes --project-name saikrupa_classes
          flutter pub get
          # Fix icon - copy logo to mipmap
          cp assets/logo.png assets/app_icon.png
          for d in android/app/src/main/res/mipmap-*; do
            cp assets/logo.png $d/ic_launcher.png
            cp assets/logo.png $d/ic_launcher_round.png
          done
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Saikrupa-Classes-APK
          path: build/app/outputs/flutter-apk/app-release.apk
