name: Build Saikrupa APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Create Android Project
        run: |
          rm -rf android/
          flutter create . --platforms=android --org com.saikrupa.classes --project-name saikrupa_classes

      - run: flutter pub get

      - name: Generate App Icon
        run: |
          echo "Generating launcher icons from assets/logo.png"
          # logo.png is icon
          cp assets/logo.png assets/app_icon.png
          for d in android/app/src/main/res/mipmap-*; do
            cp assets/app_icon.png $d/ic_launcher.png
            cp assets/app_icon.png $d/ic_launcher_round.png
          done
          ls -l android/app/src/main/res/mipmap-hdpi/

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: Saikrupa-Classes-APK
          path: build/app/outputs/flutter-apk/app-release.apk
