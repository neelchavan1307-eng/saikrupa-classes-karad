name: Build Saikrupa APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - run: flutter pub get
      - name: Generate App Icon
        run: |
          echo "Generating launcher icons from assets/logo.png"
          mkdir -p assets
          # If app_icon.png not exists, copy logo.png as icon
          if [! -f assets/app_icon.png ]; then cp assets/logo.png assets/app_icon.png; fi
          # Resize and copy to all mipmap folders
          for d in android/app/src/main/res/mipmap-*; do
            if [ -d "$d" ]; then
              cp assets/app_icon.png $d/ic_launcher.png
              cp assets/app_icon.png $d/ic_launcher_round.png
            fi
          done
          # Create android folder fresh if needed and copy
          flutter create. --platforms=android --org com.saikrupa.classes --project-name saikrupa_classes
          for d in android/app/src/main/res/mipmap-*; do cp assets/app_icon.png $d/ic_launcher.png; cp assets/app_icon.png $d/ic_launcher_round.png; done
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Saikrupa-Classes-APK
          path: build/app/outputs/flutter-apk/app-release.apk
