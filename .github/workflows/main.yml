name: Build Saikrupa APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Create android
        run: |
          cd saikrupa-classes-karad
          flutter create. --platforms=android
      - name: Get packages
        run: |
          cd saikrupa-classes-karad
          flutter pub get
      - name: Build APK
        run: |
          cd saikrupa-classes-karad
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saikrupa-Classes-APK
          path: saikrupa-classes-karad/build/app/outputs/flutter-apk/app-release.apk
