name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
      - name: Fix Android
        run: |
          rm -rf android
          flutter create. --platforms=android --org com.saikrupa --project-name saikrupa_classes_karad
          sed -i "s/ext.kotlin_version.*/ext.kotlin_version = '1.8.22'/" android/build.gradle
      - name: Write Code
        run: |
          cat > lib/main.dart << 'ENDOFFILE'
          import 'dart:convert'; import 'dart:io'; import 'package:flutter/material.dart'; import 'package:shared_preferences/shared_preferences.dart'; import 'package:screenshot/screenshot.dart'; import 'package:share_plus/share_plus.dart'; import 'package:path_provider/path_provider.dart';
          void main() async { WidgetsFlutterBinding.ensureInitialized(); runApp(const SaikrupaApp()); }
          class SaikrupaApp extends StatelessWidget { const SaikrupaApp({super.key}); @override Widget build(BuildContext context) { return const MaterialApp(debugShowCheckedModeBanner: false, home: HomeScreen()); } }
