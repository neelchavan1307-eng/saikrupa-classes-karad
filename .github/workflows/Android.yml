name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
      - name: Update SDK to 34
        run: |
          sed -i 's/compileSdk 33/compileSdk 34/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/targetSdk 33/targetSdk 34/g' android/app/build.gradle || true
          sed -i 's/targetSdkVersion 33/targetSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/flutter.compileSdkVersion.*/flutter.compileSdkVersion 34/g' android/local.properties || true
          sed -i 's/flutter.targetSdkVersion.*/flutter.targetSdkVersion 34/g' android/local.properties || true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
