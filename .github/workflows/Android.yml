name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Fix Old Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.saikrupa --project-name saikrupa_classes_karad
          
      - name: Fix Kotlin Duplicate Class
        run: |
          sed -i "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.8.22'/" android/build.gradle
          echo '
          configurations.all {
              resolutionStrategy {
                  force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                  force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
              }
          }' >> android/app/build.gradle
          cat android/build.gradle
          cat android/app/build.gradle

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saikrupa-apk
          path: build/app/outputs/flutter-apk/app-release.apk
