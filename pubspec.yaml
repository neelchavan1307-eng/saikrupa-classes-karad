name: saikrupa_classes
description: Sai Krupa Classes App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.0
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/
  
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: false
